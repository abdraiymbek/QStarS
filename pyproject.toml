[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qstars"
version = "0.1.0"
description = "Conservative one-dimensional quasi-star research software"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "PyYAML>=6", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]
audit = ["pypdf>=5", "requests>=2", "beautifulsoup4>=4"]

[project.scripts]
qstars = "qstars.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qstars = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
