schema_version: 1
benchmarks:
  - id: cmfgen_cool_hhe_recombination
    source: cmfgen_hminus_cool_audit
    status: failed_cool_nonlinear_thermal_and_energy_gate
    command: python scripts/audit_cmfgen_cool.py NATIVE_RUN AUDIT_OUTPUT
    required_checks: [cool_recombination_coverage, population_charge, radiation_energy, cumulative_interior_energy, nonlinear_convergence, thermal_convergence, spatial_frequency_convergence]
    limitation: Primordial prescribed-flow controls at T9/T6 reference input scales; not metal-bearing published atmosphere replicas, mass-loss eigenvalues or evolutionary tracks.
    evidence: Reports/Report_14.md
  - id: resolved_hhe_material_differential
    source: resolved_nlte_material_differential
    status: ideal_frozen_population_component_pass_relaxed_response_missing
    command: python -m pytest -q tests/test_nlte_material.py
    required_checks: [population_energy, ionization_excitation, negative_ion_detachment, pressure_work, gauge_invariance, constrained_directional_derivatives, lte_chain_rule]
    limitation: No nonideal/dissolution free energy, relaxed global non-LTE response or production sonic closure.
    evidence: Reports/evidence/cool_20260929/pytest_final.txt
  - id: cmfgen_native_reference
    source: cmfgen_native_2025
    status: reference_profile_compatibility_pass_thermal_certification_fail
    command: python scripts/validate_cmfgen_component.py NATIVE_RUN AUDIT_OUTPUT --reference PINNED_REFERENCE
    required_observables: [temperature, electron_density, radiation_moments, flux_opacity, radiative_acceleration]
    limitation: Supplied hot metal/clumped Zeta Pup-like model with fixed temperature and prescribed flow; no mass-loss eigenvalue or quasi-star evolution.
    evidence: Reports/evidence/backend_20260928/final_audit/zpup_4/validation.json
  - id: cmfgen_reduced_hhe
    source: nlte_material_contract
    status: scoped_transfer_refinement_pass_joint_thermal_and_wind_closure_fail
    command: python scripts/validate_cmfgen_component.py NATIVE_RUN AUDIT_OUTPUT --hhe
    required_checks: [spectral_moments, scattering_work, population_nuclei, charge, electron_balance, radiation_energy, nonlinear_convergence, radius_frequency_refinement, export_invariance]
    limitation: Hot H/He prescribed-flow component; cool atom sufficiency, kinetic derivatives, global CMF response and convective handoff are not validated.
    evidence: Reports/evidence/backend_20260928/final_audit/campaign_summary.json
  - id: ball_loaded_polytropes
    source: ball2011
    location: section 4.1
    command: qstars validate --quick
    status: implemented_structure_replication
    targets: {n2: 0.127, n3: 0.102, n4: 0.089}
    absolute_tolerance: 0.0005
    tolerance_reason: Half a unit in the last published decimal place.
  - id: corrected_bondi_limits
    source: coughlin2024
    location: section 2, equations 2-7 and figure 1 prose
    command: qstars validate --quick
    status: implemented_structure_replication
  - id: saturated_composite
    source: coughlin2024
    location: section 3, equations 11-21
    command: qstars validate --quick
    status: implemented_with_documented_cutoff_discrepancy
  - id: ball_stellar_tracks
    source: ball2011
    location: table 1
    reference_file: ball2011_table1.csv
    status: pending_microphysics_and_moving_cavity
    uncertainties: Published table rounding; no figure digitization performed.
  - id: quest_stellar_tracks
    source: quest2025
    status: pinned_execution_attempted_no_complete_track
    command: python scripts/run_mesa_reference.py --family quest_saturated --saved-seed --mesa-dir PATH --sdk-dir PATH
    discrepancy: Both upstream and explicitly documented startup CGS conversion experiments stalled during inner relaxation within the wall budget.
  - id: fiacconi_wind
    source: fiacconi2016
    status: stationary_equations_implemented_full_evolution_pending
    command: python scripts/validate_wind.py
    configurations: [fiacconi2016_diffusion_wind.yaml, fiacconi2016_advective_wind.yaml]
    reference_file: fiacconi2016_figure4.csv
    uncertainties: Explicit vector-path calibration and stroke uncertainty in fiacconi2016_figure4.json; base Mach 0.8 +/- 0.05 from the paper, never fitted.
    discrepancy: Not all printed Figure 4 diagnostics match; LTE versus variable-Eddington-factor sound speed and percent-level energy-curve differences retained.
  - id: fiacconi_evolution
    source: fiacconi2016
    location: Section 3, Figure 8
    status: pending_conservative_envelope_wind_atmosphere_coupling
    required_observables: [BH_growth, envelope_mass, wind_rate, luminosity, radius, effective_temperature]
  - id: dotan_evolution
    source: dotan2011
    location: Sections 4-5
    status: pending_porous_atmosphere_and_full_evolution
    required_observables: [BH_growth, envelope_mass, wind_rate, lifetime, photosphere]
  - id: hassan_stellar_tracks
    source: hassan2025
    status: pending_moving_corrected_bondi_cavity_evolution
  - id: cantiello_stability
    source: cantiello2025
    status: pending_gyre_and_ionization_opacity
  - id: mesa_native_atmosphere
    source: mesa_atmosphere_mlt
    status: reference_passes_equations_fails_implicit_vacuum_boundary
    command: python scripts/audit_outer_microphysics.py --library PATH --mesa-dir PATH
    discrepancy: Varying-opacity routine's fixed starting density gives 78.96 times the analytic vacuum gas pressure at Teff=8000 K and g=3 with constant opacity.
  - id: direct_freeeos_outer_states
    source: freeeos3
    status: component_audit_pass_not_global_eos_or_evolution_validation
    command: python scripts/audit_freeeos.py --library PATH --mesa-library PATH --mesa-dir PATH
    discrepancy: 153-state gas-only first-law audit passes; historical MESA gas pressure and low-electron states retain discrepancies; all upstream byte comparisons fail despite first-state physical-field agreement.
  - id: grey_mlt_outer_candidate
    source: grey_mlt_atmosphere_reference
    status: converged_candidate_fails_physical_validity
    command: python scripts/validate_atmosphere_reference.py --freeeos-library PATH --mesa-library PATH --mesa-dir PATH
    discrepancy: Archived Report 8 continuation requires Mach 2.3367 convection; current reference exits at Mach one near tau 2.837 for Henyey and ML1; Teff=8000 K and g=3 has a photosphere-to-base depth 6.68 percent of radius at 10000 solar masses. No physical disruption or full stellar evolution inferred.
  - id: spherical_gas_sonic_wind
    source: nakauchi2017
    location: equations 1-9; Figure 2
    status: implemented_component_published_replication_fails
    command: python scripts/validate_spherical_wind.py
    configurations: [spherical_recombining_wind.yaml]
    reference_file: nakauchi2017_figure2.csv
    uncertainties: Both radial and ordinate vector stroke widths; calibration and PDF hash in nakauchi2017_figure2.json.
    discrepancy: FreeEOS/MESA microphysics realization differs from original; no input retuning. Published escaping red branch is not reproduced.
    required_observables: [mass_flux, sonic_radius, photosphere, velocity, density, temperature, energy_partition]
  - id: spherical_outer_component_numerics
    source: nakauchi2017
    status: implemented_independent_component_campaign
    command: python scripts/validate_spherical_wind.py
    required_checks: [Parker_critical_point, spherical_radiative_zero, enclosed_mass, independent_momentum_integral, independent_diffusion_integral, independent_first_law_integral, sonic_offset, tolerance, radial_step, output_sampling, matching_radius_recovery, outer_radius, independent_integrator, stage_retries]
    limitation: Known-solution base recovery verifies numerical matching; it does not validate evolving-envelope matching, turbulence, photospheric transfer or escape.

  - id: outer_discrepancy_attribution
    source: nakauchi_opacity_audit
    status: completed_attribution_benchmark_unresolved
    command: python scripts/validate_outer_discrepancy.py
    required_checks: [historical_opacity, abundance_convention, Euler_discretization, printed_input_sensitivity, internal_profile_refinement, diffusion_validity]
    discrepancy: No tested change reproduces the published escaping red branch; conditional input samples do not constitute an enclosure or parameter fit.
  - id: outer_moving_surface_and_mlt_exit
    source: moving_wind_flux
    status: component_accounting_and_validity_exit_pass_physical_matching_unvalidated
    command: python scripts/validate_outer_transport.py
    required_checks: [independent_swept_volume, comoving_pressure_work, energy_gauge, MLT_domain_exit, profile_coverage]
    limitation: Moving interface is not coupled evolution; MLT exit is not a turbulent-wind closure.

  - id: hummer1971_grey_transfer
    source: hummer1971
    status: scoped_angular_component_pass
    command: python scripts/validate_escaping_radiation.py
    required_checks: [published_J_and_f_table, angular_flux, diffusion, streaming, Lorentz_moments, radial_mesh, inner_depth, outer_placement, closure_tolerance]
    limitation: Specified grey transfer does not provide material temperature or ionization for the original recombining wind.
  - id: constructed_continuum_escaping_wind
    source: owocki2017_analytic
    status: scoped_stationary_control_pass_physical_envelope_match_fail
    command: python scripts/validate_escaping_extent.py
    required_checks: [velocity_density_luminosity_force_profiles, radiation_work, total_energy, radial_mesh, core_rays, outer_placement, photosphere, small_drag_crosscase, retained_negative_controls]
    limitation: Mass flow and base velocity supplied; no gas EOS or sonic eigenvalue; not a published thermodynamic star or full evolution replication.
